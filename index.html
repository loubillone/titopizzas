<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tito - Comidas Congeladas</title>
    <meta
      name="description"
      content="Pizzas y pastas congeladas de calidad. Pedidos por WhatsApp. Envío a cargo del cliente a través de Uber moto."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://titopizzas.netlify.app/" />
    <meta property="og:title" content="Tito - Pizzas y Pastas" />
    <meta
      property="og:description"
      content="Pizzas y pastas congeladas de calidad. Pedidos por WhatsApp. Envío a cargo del cliente a través de Uber moto."
    />
    <meta
      property="og:image"
      content="https://titopizzas.netlify.app/img/logotito.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo Tito - Comidas Congeladas" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://titopizzas.netlify.app/" />
    <meta name="twitter:title" content="Tito - Pizzas y Pastas" />
    <meta
      name="twitter:description"
      content="Pizzas y pastas congeladas de calidad. Pedidos por WhatsApp."
    />
    <meta
      name="twitter:image"
      content="https://titopizzas.netlify.app/img/logotito.png"
    />

    <!-- WhatsApp (usa Open Graph pero con algunas especificaciones adicionales) -->
    <meta property="og:site_name" content="Tito - Pizzas y Pastas" />
    <meta property="og:locale" content="es_AR" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" type="image/png" href="img/logotito.png" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="container">
        <div class="logo-container">
          <img src="img/logotito.png" alt="Logo Tito" class="logo" />
        </div>
        <nav class="nav">
          <a href="#productos">Productos</a>
          <a href="#carrito" class="carrito-link">
            <i class="fas fa-shopping-cart"></i>
            <span class="carrito-badge" id="carrito-badge">0</span>
          </a>
        </nav>
      </div>
    </header>

    <!-- Hero Section -->
    <section
      class="hero"
      style="
        background-image: linear-gradient(
            rgba(10, 46, 80, 0.7),
            rgba(183, 17, 3, 0.7)
          ),
          url('img/titopizza.png');
      "
    >
      <div class="container">
        <h1 class="hero-title">Comidas Congeladas de Calidad</h1>
        <p class="hero-subtitle">Pizzas y Pastas listas para disfrutar</p>
      </div>
    </section>

    <!-- Productos Section -->
    <section id="productos" class="productos">
      <div class="container">
        <!-- Pizzas -->
        <h2 class="section-title">Pizzas</h2>
        <div class="productos-grid" id="pizzas-grid">
          <!-- Los productos se cargarán dinámicamente -->
        </div>

        <!-- Pastas -->
        <h2 class="section-title">Pastas</h2>
        <div class="productos-grid" id="pastas-grid">
          <!-- Los productos se cargarán dinámicamente -->
        </div>
      </div>
    </section>

    <!-- Carrito Section -->
    <section id="carrito" class="carrito">
      <div class="container">
        <h2 class="section-title">Tu Pedido</h2>
        <div class="carrito-container">
          <div class="carrito-info-envio">
            <p class="texto-envio">
              <i class="fas fa-shipping-fast"></i> Envío a cargo del cliente a
              través de Uber moto
            </p>
          </div>
          <div class="carrito-items" id="carrito-items">
            <p class="carrito-vacio">Tu carrito está vacío</p>
          </div>

          <!-- Formulario de datos del cliente -->
          <div
            class="formulario-pedido"
            id="formulario-pedido"
            style="display: none"
          >
            <h3 class="formulario-titulo">Datos para la entrega</h3>
            <div class="formulario-grid">
              <div class="form-group">
                <label for="nombre-cliente">Nombre completo *</label>
                <input
                  type="text"
                  id="nombre-cliente"
                  class="form-input"
                  placeholder="Ingresa tu nombre"
                  required
                />
              </div>
              <div class="form-group">
                <label for="domicilio-cliente">Domicilio *</label>
                <input
                  type="text"
                  id="domicilio-cliente"
                  class="form-input"
                  placeholder="Ingresa tu dirección"
                  required
                />
              </div>
            </div>
          </div>

          <div class="carrito-total">
            <p class="total-text">Total: <span id="total-precio">$0</span></p>
            <button class="btn-whatsapp" id="btn-enviar-whatsapp" disabled>
              <i class="fab fa-whatsapp"></i> Enviar Pedido por WhatsApp
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <p>
          &copy; 2026 Tito - Pizzas y pastas. Todos los derechos reservados.
        </p>
      </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/card.js"></script>
    <script src="js/app.js"></script>
    <script
      src="https://kit.fontawesome.com/1debb76961.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
